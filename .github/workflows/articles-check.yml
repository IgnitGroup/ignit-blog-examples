name: Articles catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check every article is listed in README
        run: python3 .github/scripts/check_articles.py
